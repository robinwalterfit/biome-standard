# Configuration for lefthook itself
assert_lefthook_installed: true
colors: true
glob_matcher: doublestar
no_tty: false
output:
  - meta # Print lefthook version
  - summary # Print summary block (successful and failed steps)
  - empty_summary # Print summary heading when there are no steps to run
  - success # Print successful steps
  - failure # Print failed steps printing
  - execution # Print any execution logs (but prints if the execution failed)
  - execution_out # Print execution output (but still prints failed commands output)
  - execution_info # Print `EXECUTE > ...` logging
  - skips # Print "skip" (i.e. no files matched)
source_dir: .lefthook/

# Hooks
commit-msg:
  parallel: true
  commands:
    cog-verify:
      run: cog verify --file {1}

post-checkout:
  commands:
    npm-install:
      run: npm install --ignore-scripts

post-merge:
  commands:
    npm-install:
      run: npm install --ignore-scripts

pre-commit:
  piped: true
  jobs:
    - name: 1_npm-lock
      run: git diff --exit-code --no-patch --staged 'package.json' || npm install --package-lock-only
      stage_fixed: true
    - name: 2_format
      group:
        jobs:
          - name: biome-format
            run: npx biome format --config-path ./biome.jsonc --files-ignore-unknown=true --no-errors-on-unmatched --staged --write --use-editorconfig=true
            stage_fixed: true
    - name: 3_lint
      group:
        parallel: true
        jobs:
          - name: biome-lint
            run: npx biome lint --config-path ./biome.jsonc --error-on-warnings --files-ignore-unknown=true --no-errors-on-unmatched --staged
          - name: shellcheck
            glob: "**/*.sh"
            run: shellcheck {staged_files}

pre-push:
  parallel: true
  commands:
    cog-check:
      run: cog check
